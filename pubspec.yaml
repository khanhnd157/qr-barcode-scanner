name: qr_scanner_generator
description: QR Code & Barcode Scanner and Generator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Scanning
  mobile_scanner: ^7.0.0

  # QR Generation
  qr_flutter: ^4.1.0

  # Barcode Generation
  barcode: ^2.2.8
  barcode_widget: ^2.0.4

  # Image handling
  image_gallery_saver_plus: ^4.0.1
  image_picker: ^1.1.2

  # Utilities
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  vibration: ^2.0.1
  audioplayers: ^6.1.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "logo/QR - Barcode Scanner.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0288D1"
  adaptive_icon_foreground: "logo/QR - Barcode Scanner.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
